services:
  rebana-router:
    image: rebana-router:latest
    container_name: rebana-router
    restart: always
    ports:
      - "91827:91827"
    volumes:
      - rebana-router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "91827"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:91828
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    command: ["proxy", "--port", "91828"]
    ports:
      - "91828:91828"

volumes:
  rebana-router-data:
    name: rebana-router-data
